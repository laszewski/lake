.4;">Lat: <span id="view-lat">38.993715 to 39.161233</span><br>Lon: <span id="view-lon">-86.525843 to -86.289218</span></div></div><h4 style="margin: 0 0 10px 0; font-size: 14px; color: #333;">Quick Zoom</h4><button onclick="var m = Object.values(window).find(v => v instanceof L.Map); if(m) m.setView([39.09829, -86.46397], 17);" style="display: block; width: 100%; margin: 5px 0; padding: 5px 10px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; text-align: left; font-size: 12px;">Cartop</button><button onclick="var m = Object.values(window).find(v => v instanceof L.Map); if(m) m.setView([39.06877, -86.40666], 17);" style="display: block; width: 100%; margin: 5px 0; padding: 5px 10px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; text-align: left; font-size: 12px;">Cutright</button><button onclick="var m = Object.values(window).find(v => v instanceof L.Map); if(m) m.setView([39.02275, -86.48169], 17);" style="display: block; width: 100%; margin: 5px 0; padding: 5px 10px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; text-align: left; font-size: 12px;">Fairfax</button><button onclick="var m = Object.values(window).find(v => v instanceof L.Map); if(m) m.setView([39.01638, -86.48529], 17);" style="display: block; width: 100%; margin: 5px 0; padding: 5px 10px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; text-align: left; font-size: 12px;">Osprey Trail</button><button onclick="var m = Object.values(window).find(v => v instanceof L.Map); if(m) m.setView([39.08104, -86.43379], 17);" style="display: block; width: 100%; margin: 5px 0; padding: 5px 10px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; text-align: left; font-size: 12px;">Paynetown</button><button onclick="var m = Object.values(window).find(v => v instanceof L.Map); if(m) m.setView([39.1091, -86.38909], 17);" style="display: block; width     <script>function togglePanel() {  const content = document.getElementById("panel-content");  const btn = document.getElementById("panel-toggle-btn");  if (content.style.display === "none") {    content.style.display = "block";    btn.innerText = "Minimize";  } else {    content.style.display = "none";    btn.innerText = "Expand";  }}function updateFloodLayer() {  const visible = document.getElementById("flood-visible").checked;  const color = document.querySelector('input[name="flood-color"]:checked').value;  const layers = document.querySelectorAll(".leaflet-image-layer");  if (layers.length >= 2) {    layers[0].style.opacity = (visible && color === "blue") ? "0.8" : "0";    layers[1].style.opacity = (visible && color === "red") ? "0.8" : "0";  }}function updateViewCoords(map) {  const bounds = map.getBounds();  const sw = bounds.getSouthWest();  const ne = bounds.getNorthEast();  document.getElementById("view-lat").innerText = sw.lat.toFixed(6) + " to " + ne.lat.toFixed(6);  document.getElementById("view-lon").innerText = sw.lng.toFixed(6) + " to " + ne.lng.toFixed(6);}window.onload = function() {  const map = Object.values(window).find(v => v instanceof L.Map);  if (map) {    map.on("moveend", function() { updateViewCoords(map); });    updateViewCoords(map);  }};fetch("https://monroe-lake-level.laszewski.workers.dev/level").then(response => response.json()).then(data => { const latest = data.values[data.values.length - 1][1]; document.getElementById("lake-level-value").innerText = latest + " ft"; const relative = (latest - 538.00).toFixed(2); document.getElementById("lake-level-relative").innerText = relative + " ft"; }).catch(err => { document.getElementById("lake-level-value").innerText = "Error"; });</script>
