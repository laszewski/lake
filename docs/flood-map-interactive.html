    <script>function togglePanel() {  const content = document.getElementById("panel-content");  const btn = document.getElementById("panel-toggle-btn");  if (content.style.display === "none") {    content.style.display = "block";    btn.innerText = "Minimize";  } else {    content.style.display = "none";    btn.innerText = "Expand";  }}function updateFloodLayer() {  const visible = document.getElementById("flood-visible").checked;  const color = document.querySelector('input[name="flood-color"]:checked').value;  const layers = document.querySelectorAll(".leaflet-image-layer");  if (layers.length >= 2) {    layers[0].style.opacity = (visible && color === "blue") ? "0.8" : "0";    layers[1].style.opacity = (visible && color === "red") ? "0.8" : "0";  }}fetch("https://monroe-lake-level.laszewski.workers.dev").then(response => response.json()).then(data => { const latest = data.values[data.values.length - 1][1]; document.getElementById("lake-level-value").innerText = latest + " ft"; const relative = (latest - 538.00).toFixed(2); document.getElementById("lake-level-relative").innerText = relative + " ft"; }).catch(err => { document.getElementById("lake-level-value").innerText = "Error"; });</script>
