site_name: Observing Eagles and Ospreys
site_description: A comprehensive practitioner's guide to observing and identifying Bald Eagles and Ospreys, featuring real-time lake level data and field techniques.
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  logo: images/eagle-logo-white.png
  favicon: images/eagle-logo-white.png
  features:
    - navigation.expand
    - content.code.copy

extra_css:
  - css/styles.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Guide:
      - Basics:
          - Observations: observations.md
          - Birds: birds.md
          - Age: age.md
      - Field Work:
          - Kayak: kayak.md
          - Photography:
              - General: photo.md
              - Exposure: exposure.md
              - Shot Planner: calculator.md
      - Environment:
          - Maps: maps.md
          - Lake Level: 
            - Live: live-lake-level.md
            - History: lake-level.md
            - Flood Map: lake-level-map.md
            - Interactive Flood Map: flood-map-interactive.md
          - Weather: weather.md
          - Forecast: forecast.md
      - App: app.md
